<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PB GYM</title>
<style>
:root{--bg:#090c12;--card:#131925;--muted:#929bad;--accent:#b7ff3c;--blue:#3b82f6;--line:#273142;--white:#f7f8fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:720px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(105px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}.brand{font-size:28px;font-weight:950}.brand span{color:var(--accent)}
.pill{font-size:11px;color:#111;background:var(--accent);padding:7px 9px;border-radius:99px;font-weight:900}
.hero{background:linear-gradient(135deg,#1b2331,#10151e);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:23px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;position:sticky;top:0;z-index:4;background:linear-gradient(var(--bg) 75%,transparent);padding:7px 0 13px}
.day{border:1px solid var(--line);background:#111722;color:#dce1ea;border-radius:13px;padding:12px 7px;font-weight:900;font-size:14px}.day.active{background:var(--accent);color:#111;border-color:var(--accent)}
button{touch-action:manipulation}.exercise{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px;margin:11px 0}
.top{display:flex;gap:11px;align-items:center}.num{width:34px;height:34px;border-radius:10px;background:#222c3b;display:grid;place-items:center;color:var(--accent);font-weight:950;flex:none}.name{font-size:18px;font-weight:900;flex:1}.muscle{font-size:12px;color:var(--muted);margin-top:3px}
.how{width:100%;margin-top:12px;background:#1b2637;border:1px solid #34445b;color:#fff;border-radius:12px;padding:11px;font-weight:850}
.guide{display:none;margin-top:10px;border:1px solid #30405a;border-radius:14px;padding:12px;background:#0e141e}.guide.open{display:block}
.motion{height:auto;min-height:0;border-radius:13px;background:linear-gradient(180deg,#172234,#0c1119);overflow:hidden;margin-bottom:10px;display:grid;place-items:center}
.demo{width:100%;height:100%}.demo .body{stroke:#f7f8fb;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}.demo .equip{stroke:#8d99aa;stroke-width:5;stroke-linecap:round;fill:none}.demo .head{fill:var(--accent)}.demo .joint{fill:#f7f8fb}.demo .moving{transform-box:fill-box;transform-origin:center;animation:move 1.6s ease-in-out infinite alternate}.demo .moving2{transform-box:fill-box;transform-origin:center;animation:move2 1.6s ease-in-out infinite alternate}
@keyframes move{to{transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg))}}@keyframes move2{to{transform:translate(var(--x2,0),var(--y2,0)) rotate(var(--r2,0deg))}}
.guide{overflow:hidden}.guide h4{position:relative;z-index:2;background:#0e141e}.guide p{position:relative;z-index:2;background:#0e141e}.guide h4{margin:8px 0 5px;font-size:14px}.guide p{margin:0 0 7px;color:#d5dae3;font-size:13px;line-height:1.45}.bad{color:#ffb0b0!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{background:#0d131c;border-radius:11px;padding:9px;text-align:center}.stat b{display:block}.stat small{color:var(--muted)}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 45px;gap:7px;align-items:center;margin:8px 0}.setrow input{min-width:0;width:100%;background:#0c1119;border:1px solid var(--line);color:#fff;padding:11px 8px;border-radius:10px;font-size:16px}
.check{border:1px solid #3b4657;background:#202938;color:#fff;border-radius:10px;height:43px;font-size:18px;font-weight:950}.check.done{background:var(--accent);color:#111;border-color:var(--accent)}
.finish{width:100%;background:var(--blue);border:0;color:#fff;border-radius:15px;padding:15px;font-size:16px;font-weight:900;margin-top:15px}
.timer{position:fixed;z-index:10;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(692px,calc(100% - 28px));background:#202938;border:1px solid #3a4658;border-radius:16px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #000a}.timer b{font-size:20px}.timer button{background:var(--accent);border:0;border-radius:10px;padding:10px 13px;font-weight:950}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font-weight:800;display:none;z-index:20}
@media(max-height:700px){.motion{height:70vh;min-height:330px}}@media(max-width:380px){.name{font-size:16px}.setrow{grid-template-columns:25px 1fr 1fr 42px}.app{padding-left:10px;padding-right:10px}}
</style></head>
<body><div class="toast" id="toast"></div><div class="app"><header><div class="brand">PB <span>GYM</span></div><div class="pill">MÓVIL · MASA</div></header>
<section class="hero"><h1 id="dayTitle"></h1><p>45 min · Principiante. Pulsa <b>¿Cómo se hace?</b> para ver el movimiento. Registra kg y repeticiones; al marcar ✓ empieza el descanso.</p></section>
<div class="days"><button class="day active" data-day="0">DÍA 1</button><button class="day" data-day="1">DÍA 2</button><button class="day" data-day="2">DÍA 3</button></div>
<main id="list"></main><button class="finish" id="finish">📊 Finalizar y copiar progreso</button></div>
<div class="timer"><span>Descanso <b id="clock">01:30</b></span><button id="timer90">90 s</button></div>
<script>
const plans=[
{title:'Día 1 · Pecho + cuádriceps',ex:[
['Goblet squat','Cuádriceps · glúteos · core',3,'8–10',90,'Sujeta una mancuerna pegada al pecho. Pies algo más abiertos que las caderas. Lleva la cadera atrás y abajo, mantén el pecho alto y empuja el suelo para subir.','Rodillas hacia dentro, talones levantados o espalda redondeada.','squat'],
['Press banca','Pectoral · tríceps · hombro',3,'8–10',90,'Túmbate con pies firmes. Junta ligeramente los omóplatos. Baja la barra de forma controlada hacia la parte media-baja del pecho y empuja hacia arriba.','Rebotar la barra, despegar glúteos del banco o abrir los codos completamente a 90°.','bench'],
['Remo con mancuerna','Dorsal · espalda media · bíceps',3,'10–12',75,'Apoya una mano y rodilla en el banco. Espalda neutra. Lleva la mancuerna hacia la cadera manteniendo el codo cerca del cuerpo y baja despacio.','Girar el tronco o tirar solo con el brazo.','row'],
['Press militar mancuernas','Hombros · tríceps',3,'10',75,'Mancuernas a la altura de los hombros. Abdomen firme. Empuja arriba sin chocarlas y baja controlado hasta la posición inicial.','Arquear mucho la zona lumbar o usar impulso con las piernas.','ohp'],
['Curl bíceps mancuernas','Bíceps',2,'10–12',60,'De pie, brazos junto al cuerpo. Flexiona los codos sin moverlos hacia delante. Aprieta arriba y baja lentamente.','Balancear el cuerpo o subir los hombros.','curl'],
['Tríceps en polea','Tríceps',2,'10–12',60,'Codos pegados al costado. Empuja la barra o cuerda hacia abajo hasta extender los brazos y vuelve lentamente.','Separar los codos o inclinar todo el cuerpo para mover más peso.','pushdown']]},
{title:'Día 2 · Espalda + femoral',ex:[
['Peso muerto rumano','Femoral · glúteos · espalda',3,'8–10',90,'Rodillas ligeramente flexionadas. Lleva la cadera hacia atrás mientras la carga baja pegada a las piernas. Para cuando notes tensión fuerte en femorales y vuelve apretando glúteos.','Redondear la espalda o convertirlo en una sentadilla.','rdl'],
['Jalón al pecho','Dorsal · bíceps',3,'8–12',90,'Agarra la barra algo más ancho que hombros. Pecho alto. Lleva los codos hacia abajo hasta acercar la barra a la parte alta del pecho y sube controlado.','Tirar detrás de la nuca o balancearte hacia atrás.','pulldown'],
['Press inclinado mancuernas','Pectoral superior · tríceps',3,'8–12',75,'Banco con inclinación moderada. Mancuernas junto al pecho, empuja arriba y ligeramente hacia dentro. Baja despacio.','Banco demasiado vertical o golpear las mancuernas arriba.','incline'],
['Elevaciones laterales','Deltoide lateral',3,'12–15',60,'Con poco peso y codos ligeramente flexionados, eleva los brazos hacia los lados hasta aproximadamente la altura de los hombros.','Encoger los hombros o balancearte para subir el peso.','lateral'],
['Curl martillo','Bíceps · braquial',2,'10–12',60,'Palmas mirándose durante todo el movimiento. Mantén los codos junto al cuerpo, sube las mancuernas y baja controlado.','Mover los codos hacia delante o balancear el tronco.','curl'],
['Press francés','Tríceps',2,'10–12',60,'Tumbado o sentado, mantén los brazos orientados arriba y flexiona solo los codos para llevar el peso hacia detrás de la cabeza. Extiende de nuevo.','Abrir demasiado los codos o mover todo el hombro.','french']]},
{title:'Día 3 · Full body',ex:[
['Zancadas con mancuernas','Cuádriceps · glúteos',3,'10/pierna',90,'Da un paso suficientemente largo. Baja ambas rodillas de forma controlada manteniendo el tronco estable y empuja con el pie delantero para volver.','Dar un paso demasiado corto o perder el equilibrio por ir demasiado rápido.','lunge'],
['Press banca mancuernas','Pectoral · tríceps',3,'8–12',75,'Pies firmes y omóplatos apoyados. Baja las mancuernas a ambos lados del pecho y empuja hacia arriba manteniendo control.','Bajar demasiado rápido o juntar las mancuernas con un golpe.','bench'],
['Remo con barra/mancuernas','Espalda · bíceps',3,'8–12',75,'Inclina el torso manteniendo espalda neutra. Lleva la carga hacia el abdomen, junta los omóplatos y baja sin perder la postura.','Redondear la espalda o levantarte en cada repetición.','row'],
['Hip thrust','Glúteos · femoral',3,'10–12',75,'Apoya la parte alta de la espalda en un banco. Empuja con los talones y eleva la cadera hasta alinear hombros, cadera y rodillas. Aprieta glúteos arriba.','Hiperextender la zona lumbar o empujar principalmente con las puntas de los pies.','hip'],
['Elevaciones laterales','Deltoide lateral',2,'12–15',60,'Eleva las mancuernas hacia los lados con poco peso y control, llegando aproximadamente a la altura de los hombros.','Balancearte o encoger los hombros.','lateral'],
['Curl + tríceps polea','Bíceps · tríceps',2,'10–12',60,'Haz primero el curl manteniendo los codos quietos y después la extensión de tríceps con los codos pegados al cuerpo.','Usar impulso o sacrificar técnica por terminar rápido la superserie.','combo']]}
];

function svg(type){
 const ids={squat:'a2a797d0-f6f6-436e-8616-6c1d93e73d67',bench:'dd7e706c-2086-4f4b-867f-d7fece2f720d',row:'d3fece95-c7e2-4794-ba8f-65a5b3e30a28',lateral:'a16f0235-20eb-4306-b9cc-c01ae51b3b9b',curl:'b11e6c6f-b2e8-44ca-95dc-adf0dcd34426',rdl:'e7175536-9d7d-4f5d-8d49-26c3411eac80',pulldown:'9302ad5d-b97a-4b27-afae-611b6ce70a06',incline:'35a53872-f47c-4ec6-9bdd-888eb1705572',pushdown:'9a550e2c-c55e-495d-b59e-b676c3d48a41',french:'c57e3719-a853-453f-b04a-da0c9475d6e7'};
 const video=(id,label='')=>{const base='https://ymove.app/api/free/'+id;return `<div style="background:#eef1ef">${label?`<div style="padding:7px 10px;color:#111;font-weight:800;font-size:12px">${label}</div>`:''}<video style="width:100%;height:auto;max-height:72vh;object-fit:contain;object-position:center;background:#eef1ef;display:block;margin:0 auto" autoplay muted loop playsinline poster="${base}?type=thumbnail"><source src="${base}?type=video" type="video/mp4"></video></div>`};
 if(ids[type]) return video(ids[type]);
 if(type==='combo') return `<div style="display:grid;gap:8px">${video(ids.curl,'1 · CURL DE BÍCEPS')}${video(ids.pushdown,'2 · TRÍCEPS EN POLEA')}</div>`;
 const repdb={ohp:['dumbbell-shoulder-press','Press militar con mancuernas'],lunge:['db-lunge','Zancadas con mancuernas'],hip:['dumbbell-hip-thrust','Hip thrust con mancuerna']};
 if(repdb[type]){
   const [slug,label]=repdb[type], base='https://exercise-dataset.com/images/flat/';
   return `<div style="background:#eef1ef;padding:8px"><div style="color:#111;font-weight:900;font-size:13px;margin:2px 4px 8px">${label} · INICIO → FINAL</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center"><img src="${base}${slug}-start.webp" alt="${label} posición inicial" style="width:100%;height:auto;max-height:58vh;object-fit:contain;background:white;border-radius:10px"><img src="${base}${slug}-peak.webp" alt="${label} posición final" style="width:100%;height:auto;max-height:58vh;object-fit:contain;background:white;border-radius:10px"></div><div style="color:#58606c;font-size:10px;margin:7px 4px 0">Imágenes: RepDB · exercise-dataset.com</div></div>`;
 }
 return `<div style="padding:20px;text-align:center">Demostración no disponible.</div>`;
}
let current=Number(localStorage.getItem('pbgym-day')||0),timer;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function key(i,s,f){return `pbgym-${current}-${i}-${s}-${f}`}
function render(){
 $('#dayTitle').textContent=plans[current].title; $$('.day').forEach((b,i)=>b.classList.toggle('active',i===current));
 $('#list').innerHTML=plans[current].ex.map((e,i)=>`<article class="exercise"><div class="top"><div class="num">${i+1}</div><div class="name">${e[0]}<div class="muscle">${e[1]}</div></div></div><button class="how" data-guide="g${i}">▶ ¿Cómo se hace?</button><div class="guide" id="g${i}"><div style="font-size:12px;color:#929bad;margin:10px 2px 7px">DEMOSTRACIÓN · CUERPO COMPLETO</div><div class="motion">${svg(e[7])}</div><h4>Cómo hacerlo</h4><p>${e[5]}</p><h4>⚠️ Evita esto</h4><p class="bad">${e[6]}</p><p><b>Regla:</b> movimiento controlado y sin dolor. Si dudas con la técnica, pide al monitor del gimnasio que revise tu postura.</p></div><div class="stats"><div class="stat"><b>${e[2]}</b><small>series</small></div><div class="stat"><b>${e[3]}</b><small>reps</small></div><div class="stat"><b>${e[4]} s</b><small>descanso</small></div></div><div>${Array.from({length:e[2]},(_,s)=>`<div class="setrow"><b>${s+1}</b><input inputmode="decimal" placeholder="kg" data-k="${key(i,s,'kg')}" value="${localStorage.getItem(key(i,s,'kg'))||''}"><input inputmode="numeric" placeholder="reps" data-k="${key(i,s,'r')}" value="${localStorage.getItem(key(i,s,'r'))||''}"><button class="check ${localStorage.getItem(key(i,s,'d'))?'done':''}" data-done="${key(i,s,'d')}" data-sec="${e[4]}">✓</button></div>`).join('')}</div></article>`).join(''); bind();
}
function bind(){
 $$('.how').forEach(b=>b.onclick=()=>{const g=document.getElementById(b.dataset.guide);g.classList.toggle('open');b.textContent=g.classList.contains('open')?'▼ Ocultar explicación':'▶ ¿Cómo se hace?'});
 $$('input[data-k]').forEach(x=>x.oninput=()=>localStorage.setItem(x.dataset.k,x.value));
 $$('.check').forEach(b=>b.onclick=()=>{const k=b.dataset.done;if(localStorage.getItem(k)){localStorage.removeItem(k);b.classList.remove('done')}else{localStorage.setItem(k,'1');b.classList.add('done');startTimer(Number(b.dataset.sec))}});
}
$$('.day').forEach(b=>b.onclick=()=>{current=Number(b.dataset.day);localStorage.setItem('pbgym-day',current);render();window.scrollTo({top:0,behavior:'smooth'})});
function startTimer(sec){clearInterval(timer);let n=sec;const c=$('#clock');const draw=()=>c.textContent=`${String(Math.floor(Math.max(n,0)/60)).padStart(2,'0')}:${String(Math.max(n,0)%60).padStart(2,'0')}`;draw();timer=setInterval(()=>{n--;draw();if(n<=0){clearInterval(timer);if(navigator.vibrate)navigator.vibrate([200,100,200]);toast('Descanso terminado 💪')}},1000)}
$('#timer90').onclick=()=>startTimer(90);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
$('#finish').onclick=async()=>{let out=`PB GYM — ${plans[current].title}\n`;plans[current].ex.forEach((e,i)=>{out+=`\n${i+1}. ${e[0]}\n`;for(let s=0;s<e[2];s++){out+=`  Serie ${s+1}: ${localStorage.getItem(key(i,s,'kg'))||'-'} kg × ${localStorage.getItem(key(i,s,'r'))||'-'} reps ${localStorage.getItem(key(i,s,'d'))?'✓':''}\n`}});try{await navigator.clipboard.writeText(out);toast('Progreso copiado. Pégalo en ChatGPT.')}catch{prompt('Copia tu progreso:',out)}};
render();
</script></body></html>
